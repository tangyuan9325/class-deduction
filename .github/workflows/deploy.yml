name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build & Test & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Go Build
        run: |
          go build -o class-deduction-bin ./cmd
          ls -lh class-deduction-bin

      - name: Go Vet
        run: go vet ./...

      - name: Smoke Test (start server & hit APIs)
        run: |
          APP_SERVER_PORT=18080 ./class-deduction-bin > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          # 健康检查
          curl -sf http://localhost:18080/health || { cat /tmp/server.log; exit 1; }
          # 登录拿 token（种子管理员，仅用于冒烟测试）
          TOKEN=$(curl -sf -X POST http://localhost:18080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['token'])")
          [ -n "$TOKEN" ]
          # 看板统计
          curl -sf http://localhost:18080/api/v1/stats/overview -H "Authorization: Bearer $TOKEN" > /dev/null
          # 字典四类（学习/寝室/日常/两操）
          curl -sf http://localhost:18080/api/v1/dictionaries -H "Authorization: Bearer $TOKEN" | grep -q '学习' || { echo "字典缺少四类"; exit 1; }
          # 班主任账号存在
          curl -sf -X POST http://localhost:18080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"banzhuren","password":"123456"}' | grep -q 'teacher' || { echo "班主任账号异常"; exit 1; }
          # SSE 事件流端点可连
          timeout 3 curl -sf -N "http://localhost:18080/api/v1/events?token=$TOKEN" | head -c 200 > /dev/null
          kill $SERVER_PID || true
          echo "SMOKE_TEST_OK"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: class-deduction-linux-amd64
          path: class-deduction-bin

  deploy-server:
    name: Deploy to Server (optional)
    runs-on: ubuntu-latest
    needs: build-test-release
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build binary
        run: go build -o class-deduction-bin ./cmd

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "class-deduction-bin,web/dist,config"
          target: ${{ secrets.DEPLOY_PATH || '/opt/class-deduction' }}

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/class-deduction' }}
            chmod +x class-deduction-bin
            pkill -f class-deduction-bin || true
            nohup ./class-deduction-bin > server.log 2>&1 &
            sleep 2
            curl -sf http://localhost:8080/health && echo DEPLOY_OK
