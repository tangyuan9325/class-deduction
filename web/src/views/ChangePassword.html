  <div class="cp-wrap">
    <div class="cp-box">
      <div class="cp-title">
        <h2>修改密码</h2>
        <p>首次登录请设置新密码，并将姓名确认为自己的名字</p>
      </div>
      <el-form ref="formRef" :model="form" :rules="rules" label-position="top" size="large">
        <el-form-item label="姓名" prop="real_name">
          <el-input v-model="form.real_name" placeholder="请输入自己的姓名" :prefix-icon="User" />
        </el-form-item>
        <el-form-item label="新密码" prop="new_password">
          <el-input v-model="form.new_password" type="password" placeholder="请输入新密码（至少6位）" show-password :prefix-icon="Lock" />
        </el-form-item>
        <el-form-item label="确认新密码" prop="confirm_password">
          <el-input v-model="form.confirm_password" type="password" placeholder="请再次输入新密码" show-password :prefix-icon="Lock" />
        </el-form-item>
        <el-form-item>
          <el-button type="primary" class="cp-btn" :loading="loading" @click="onSubmit">确认修改</el-button>
        </el-form-item>
        <div class="cp-tip">修改后将使用新密码登录，系统内将以你的姓名显示</div>
      </el-form>
    </div>
  </div>
