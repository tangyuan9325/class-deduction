<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级量化考核管理系统</title>
<style>
:root{
  --bg:#0d1117; --panel:rgba(22,27,34,.85); --panel2:rgba(13,17,23,.92);
  --border:rgba(139,148,158,.18); --text:#e6edf3; --text2:#9da7b3; --text3:#768390;
  --accent:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#bc8cff;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;
  background-image:radial-gradient(1200px 600px at 20% -10%,rgba(88,166,255,.10),transparent 60%),radial-gradient(1000px 500px at 90% 10%,rgba(188,140,255,.08),transparent 55%)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;background:rgba(13,17,23,.7);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--text3)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--text2);font-weight:600;background:rgba(22,27,34,.5);white-space:nowrap}
tr:hover td{background:rgba(88,166,255,.04)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--border);color:var(--text2);background:rgba(139,148,158,.1)}
.tag.green{color:var(--green);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.1)}
.tag.red{color:var(--red);border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.1)}
.tag.blue{color:var(--accent);border-color:rgba(88,166,255,.4);background:rgba(88,166,255,.1)}
.tag.yellow{color:var(--yellow);border-color:rgba(210,153,34,.4);background:rgba(210,153,34,.1)}
.tag.purple{color:var(--purple);border-color:rgba(188,140,255,.4);background:rgba(188,140,255,.1)}
.hide{display:none!important}
/* ===== 登录 ===== */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px 32px;backdrop-filter:blur(10px)}
.login-title{font-size:22px;font-weight:700;text-align:center;background:linear-gradient(120deg,#e6edf3,#58a6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.login-sub{text-align:center;color:var(--text3);font-size:12px;margin-bottom:26px}
.login-card .fld{margin-bottom:16px}
.login-card label{display:block;color:var(--text2);font-size:13px;margin-bottom:6px}
.login-card input{width:100%}
.remember-row{display:flex;gap:18px;margin-bottom:20px;font-size:13px}
.remember-row label{color:var(--text2);display:flex;align-items:center;gap:6px;cursor:pointer}
.btn{background:linear-gradient(135deg,#1f6feb,#388bfd);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn.block{width:100%;padding:12px;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn.danger{background:rgba(248,81,73,.15);color:var(--red);border:1px solid rgba(248,81,73,.35)}
.btn.success{background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.35)}
.btn.mini{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.warn{background:rgba(210,153,34,.15);color:var(--yellow);border:1px solid rgba(210,153,34,.35)}
.login-tip{text-align:center;color:var(--text3);font-size:12px;margin-top:16px;line-height:1.8}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px;text-align:center}
/* ===== 主布局 ===== */
#appView{display:flex;min-height:100vh}
.side{width:224px;flex-shrink:0;background:var(--panel2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px;border-bottom:1px solid var(--border)}
.brand-name{font-size:16px;font-weight:700;color:var(--text)}
.brand-sub{font-size:11px;color:var(--text3);margin-top:2px}
.brand-ver{display:inline-block;margin-top:8px;font-size:11px;color:var(--accent);border:1px solid rgba(88,166,255,.4);padding:1px 8px;border-radius:999px;background:rgba(88,166,255,.08)}
.menu{flex:1;padding:10px 8px;overflow-y:auto}
.menu-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text2);cursor:pointer;margin-bottom:2px;font-size:13.5px;transition:background .12s}
.menu-item:hover{background:rgba(88,166,255,.08);color:var(--text)}
.menu-item.active{background:linear-gradient(135deg,rgba(31,111,235,.25),rgba(56,139,253,.12));color:var(--accent);border:1px solid rgba(88,166,255,.3)}
.menu-item .ico{width:20px;text-align:center;font-size:15px}
.menu-item .badge{margin-left:auto;font-size:11px;color:var(--text3)}
.userbox{padding:14px;border-top:1px solid var(--border);font-size:12px}
.userbox .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.userbox .nm{color:var(--text);font-weight:600;font-size:13px}
.userbox .act{color:var(--accent);cursor:pointer;font-size:12px;text-decoration:none}
.userbox .act:hover{text-decoration:underline}
.main{flex:1;padding:22px 26px;overflow-y:auto;max-width:1400px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:700}
.page-sub{color:var(--text3);font-size:12.5px;margin-top:2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;backdrop-filter:blur(8px)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title::before{content:"";width:4px;height:14px;background:linear-gradient(180deg,#1f6feb,#388bfd);border-radius:2px}
/* 统计卡片 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat .lbl{color:var(--text3);font-size:12px}
.stat .val{font-size:26px;font-weight:700;margin-top:6px}
.stat .val.red{color:var(--red)} .stat .val.green{color:var(--green)} .stat .val.blue{color:var(--accent)}
.stat .val.yellow{color:var(--yellow)} .stat .val.purple{color:var(--purple)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.side{width:64px}.side .brand-sub,.side .menu-item span,.side .userbox .row>div:not(.nm){display:none}.menu-item{justify-content:center}.main{padding:16px}}
/* 表单 */
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}
.form-row .fld label{display:block;color:var(--text2);font-size:12.5px;margin-bottom:5px}
.form-row .fld input,.form-row .fld select{width:100%}
.hint{color:var(--text3);font-size:12px}
/* 表格容器 */
.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
.table-wrap .card{padding:0;border:none;margin:0}
.pager{display:flex;align-items:center;gap:10px;padding:12px 16px;justify-content:flex-end;color:var(--text2);font-size:13px}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
.dialog{background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:26px;width:92%;max-width:560px;max-height:86vh;overflow-y:auto}
.dialog h3{font-size:17px;margin-bottom:16px}
.dialog .fld{margin-bottom:14px}
.dialog .fld label{display:block;color:var(--text2);font-size:12.5px;margin-bottom:5px}
.dialog .fld input,.dialog .fld select{width:100%}
.dlg-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.perm-box{display:flex;flex-wrap:wrap;gap:8px}
.perm-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text2);font-size:13px;cursor:pointer;user-select:none}
.perm-pill.on{color:var(--accent);border-color:rgba(88,166,255,.5);background:rgba(88,166,255,.1)}
/* 代码块 */
.code-line{display:flex;align-items:center;gap:10px;background:rgba(13,17,23,.8);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.code-line code{color:var(--accent);font-size:13px;word-break:break-all;flex:1}
/* toast */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(22,27,34,.95);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;transition:all .25s;z-index:200;box-shadow:0 6px 24px rgba(0,0,0,.4);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:rgba(248,81,73,.5);color:var(--red)}
/* 更新日志 */
.notes{color:var(--text2);font-size:13px}
.notes li{margin:6px 0;margin-left:18px}
/* 排名条 */
.topbar{display:flex;align-items:center;gap:10px;margin:6px 0}
.topbar .rank{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.topbar .r1{background:rgba(210,153,34,.2);color:var(--yellow)}.topbar .r2{background:rgba(139,148,158,.2);color:var(--text2)}.topbar .r3{background:rgba(188,140,255,.2);color:var(--purple)}
.topbar .rN{background:rgba(139,148,158,.08);color:var(--text3)}
.topbar .bar{height:8px;border-radius:4px;background:rgba(139,148,158,.12);flex:1;overflow:hidden}
.topbar .bar i{display:block;height:100%;border-radius:4px}
.topbar .num{width:40px;text-align:right;font-weight:600}
.tabs{display:inline-flex;background:rgba(22,27,34,.6);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:none;background:transparent;color:var(--text2);padding:7px 16px;border-radius:8px;font-size:13px}
.tabs button.on{background:linear-gradient(135deg,rgba(31,111,235,.35),rgba(56,139,253,.2));color:var(--accent)}
.empty{text-align:center;color:var(--text3);padding:40px 0;font-size:13px}
.check{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px;cursor:pointer;user-select:none}
</style>
</head>
<body>
<div id="loginView">
  <div class="login-card">
    <div class="login-title">班级量化考核管理系统</div>
    <div class="login-sub" id="loginSub">v1.1.0 · GitHub Pages 在线版</div>
    <div class="fld"><label>账号</label><input id="loginUser" placeholder="教师/学生账号" autocomplete="username"></div>
    <div class="fld"><label>密码</label><input id="loginPass" type="password" placeholder="初始密码 123456" autocomplete="current-password"></div>
    <div class="remember-row">
      <label><input type="radio" name="remember" value="0" checked> 临时登录</label>
      <label><input type="radio" name="remember" value="1"> 保持登录</label>
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn block" id="btnLogin">登 录</button>
  </div>
</div>

<div id="appView" class="hide">
  <aside class="side">
    <div class="brand">
      <div class="brand-name">班级量化考核</div>
      <div class="brand-sub" id="brandSub">v1.1.0</div>
      <div class="brand-ver" id="brandVer">v1.1.0</div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="userbox">
      <div class="row"><span class="nm" id="whoami"></span><span class="tag" id="roleTag"></span></div>
      <div class="row" style="color:var(--text3)" id="syncText">同步中…</div>
      <div class="row"><a class="act" id="btnChgPass" href="javascript:void(0)">修改密码</a>&nbsp;·&nbsp;<a class="act" id="btnLogout" href="javascript:void(0)">退出登录</a></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="changelogMask" class="mask hide">
  <div class="dialog">
    <h3>🎉 系统已更新到 v1.1.0</h3>
    <ul class="notes" id="changelogList"></ul>
    <div class="dlg-btns"><button class="btn" id="btnChangelogOk">我知道了</button></div>
  </div>
</div>

<div id="confirmMask" class="mask hide">
  <div class="dialog" style="max-width:420px">
    <div id="confirmMsg" style="font-size:14px;line-height:1.8"></div>
    <div class="dlg-btns"><button class="btn ghost" id="btnConfirmNo">取消</button><button class="btn" id="btnConfirmOk">确定</button></div>
  </div>
</div>

<div id="toast"></div>
<script src="gh-token.js?v=1.1.0"></script>
<script src="app.js?v=1.1.0"></script>
<script src="views.js?v=1.1.0"></script>
</body>
</html>
